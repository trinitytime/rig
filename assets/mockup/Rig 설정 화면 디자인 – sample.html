<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Git 동기화 — 설정</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #faf9f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">
      This page requires JavaScript to display.
    </div>
  </noscript>
</head>
<body>
  <div id="__bundler_placeholder">Loading Git 동기화 — 설정...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

{}
  </script>

[]
  </script>

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html lang=\"ko\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Git 동기화 — 설정<\u002Ftitle>\n<style>/* Rig UI — 호스트 제공 설정 화면 스타일. 색 값은 :root 토큰에서만 정의한다. */\n\n:root {\n  color-scheme: light dark;\n\n  --bg: #f2f0ea;            /* paper */\n  --surface: #fbfaf7;\n  --fg: #1c1c1a;            /* ink */\n  --muted: #5c5a54;\n  --border: #d6d2c7;\n  --accent: #b0441a;        /* 텍스트·포커스용 (paper 대비 5:1) */\n  --accent-fill: #e8622a;   /* 브랜드 accent, 채움용 */\n  --on-accent: #1c1c1a;     /* accent-fill 위 글자 (5:1) */\n  --danger: #b3261e;\n  --on-danger: #ffffff;\n  --success: #2e6b34;\n  --warning: #8a5a00;\n\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 24px;\n  --space-6: 32px;\n\n  --radius: 6px;\n  --shadow: 0 1px 2px rgb(28 28 26 / 0.06), 0 0 0 1px rgb(28 28 26 / 0.02);\n\n  --font: system-ui, -apple-system, \"Segoe UI\", \"Apple SD Gothic Neo\", \"Malgun Gothic\", sans-serif;\n  --font-mono: ui-monospace, \"SF Mono\", Menlo, Consolas, monospace;\n  --text-xs: 12px;\n  --text-sm: 13px;\n  --text-md: 14px;\n  --text-lg: 16px;\n  --text-xl: 20px;\n  --leading: 1.5;\n  --leading-tight: 1.3;\n\n  --control-h: 32px;\n  --duration: 120ms;\n}\n\n@media (prefers-color-scheme: dark) {\n  :root {\n    --bg: #1c1c1a;\n    --surface: #262623;\n    --fg: #f2f0ea;\n    --muted: #a8a59c;\n    --border: #3d3c37;\n    --accent: #f08a5d;\n    --accent-fill: #e8622a;\n    --on-accent: #1c1c1a;\n    --danger: #ff8a80;\n    --on-danger: #1c1c1a;\n    --success: #7cc884;\n    --warning: #e0b25a;\n    --shadow: 0 1px 2px rgb(0 0 0 / 0.4);\n  }\n}\n\n@media (prefers-reduced-motion: reduce) {\n  :root { --duration: 0ms; }\n}\n\n/* ---------- 페이지 ---------- */\n\n.rig-page {\n  container: rig / inline-size;\n  max-width: 760px;\n  margin: 0 auto;\n  padding: var(--space-6) var(--space-5);\n  display: grid;\n  gap: var(--space-5);\n  background: var(--bg);\n  color: var(--fg);\n  font: var(--text-md) / var(--leading) var(--font);\n  -webkit-font-smoothing: antialiased;\n}\n\n.rig-heading {\n  margin: 0;\n  font-size: var(--text-xl);\n  font-weight: 600;\n  line-height: var(--leading-tight);\n  text-wrap: balance;\n}\nh2.rig-heading, h3.rig-heading { font-size: var(--text-lg); }\n\n.rig-text { margin: 0; color: var(--fg); text-wrap: pretty; }\n.rig-text--muted { color: var(--muted); font-size: var(--text-sm); }\n\n.rig-divider {\n  margin: 0;\n  border: 0;\n  border-top: 1px solid var(--border);\n}\n\n.rig-actions {\n  display: flex;\n  flex-wrap: wrap;\n  gap: var(--space-2);\n  justify-content: flex-end;\n}\n\n/* ---------- 섹션 (details) ---------- */\n\n.rig-section {\n  background: var(--surface);\n  border: 1px solid var(--border);\n  border-radius: var(--radius);\n  box-shadow: var(--shadow);\n}\n\n.rig-section > summary {\n  display: flex;\n  align-items: center;\n  gap: var(--space-2);\n  min-height: 40px;\n  padding: var(--space-2) var(--space-4);\n  font-weight: 600;\n  cursor: pointer;\n  list-style: none;\n  border-radius: var(--radius);\n  user-select: none;\n}\n.rig-section > summary::-webkit-details-marker { display: none; }\n.rig-section > summary::before {\n  content: \"\";\n  width: 6px;\n  height: 6px;\n  border-right: 1.5px solid var(--muted);\n  border-bottom: 1.5px solid var(--muted);\n  transform: rotate(-45deg);\n  transition: transform var(--duration) ease-out;\n}\n.rig-section[open] > summary::before { transform: rotate(45deg); }\n.rig-section[open] > summary { border-bottom: 1px solid var(--border); border-radius: var(--radius) var(--radius) 0 0; }\n.rig-section > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }\n\n.rig-section-desc {\n  margin: 0;\n  padding: var(--space-3) var(--space-4) 0;\n  color: var(--muted);\n  font-size: var(--text-sm);\n}\n\n/* ---------- 설정 행 ---------- */\n\n.rig-row {\n  display: grid;\n  grid-template-columns: minmax(0, 1fr) auto;\n  align-items: center;\n  gap: var(--space-2) var(--space-5);\n  padding: var(--space-3) var(--space-4);\n}\n.rig-row + .rig-row { border-top: 1px solid var(--border); }\n\n.rig-row-info { display: grid; gap: 2px; min-width: 0; }\n.rig-row-label { font-weight: 500; }\n.rig-row-desc { margin: 0; color: var(--muted); font-size: var(--text-sm); text-wrap: pretty; }\n\n.rig-row-control {\n  display: flex;\n  align-items: center;\n  justify-content: flex-end;\n  gap: var(--space-2);\n  min-width: 0;\n}\n.rig-row-control > .rig-input,\n.rig-row-control > .rig-select,\n.rig-row-control > .rig-field { width: 240px; }\n.rig-row-control > .rig-input[type=\"number\"] { width: 96px; }\n\n/* 컨트롤이 넓게 필요한 행(textarea, 표): 라벨 아래로 */\n.rig-row--block { grid-template-columns: minmax(0, 1fr); }\n.rig-row--block > .rig-row-control { justify-content: flex-start; }\n.rig-row--block > .rig-row-control > * { width: 100%; }\n\n@container rig (max-width: 599px) {\n  .rig-row { grid-template-columns: minmax(0, 1fr); align-items: start; }\n  .rig-row-control { justify-content: flex-start; flex-wrap: wrap; }\n  .rig-row-control > .rig-input,\n  .rig-row-control > .rig-select,\n  .rig-row-control > .rig-field { width: 100%; }\n}\n\n/* ---------- 입력 공통 ---------- */\n\n.rig-input,\n.rig-textarea,\n.rig-select {\n  box-sizing: border-box;\n  min-height: var(--control-h);\n  padding: 0 var(--space-3);\n  font: inherit;\n  font-size: var(--text-md);\n  color: var(--fg);\n  background-color: var(--surface);\n  border: 1px solid var(--border);\n  border-radius: var(--radius);\n  transition: border-color var(--duration) ease-out;\n}\n.rig-input[type=\"number\"] { font-variant-numeric: tabular-nums; }\n.rig-input::placeholder,\n.rig-textarea::placeholder { color: var(--muted); }\n\n.rig-textarea {\n  display: block;\n  width: 100%;\n  min-height: calc(var(--control-h) * 2.5);\n  padding: var(--space-2) var(--space-3);\n  line-height: var(--leading);\n  resize: vertical;\n}\n.rig-textarea--mono { font-family: var(--font-mono); font-size: var(--text-sm); }\n\n.rig-select {\n  appearance: none;\n  padding-right: var(--space-6);\n  cursor: pointer;\n  background-image:\n    linear-gradient(45deg, transparent 50%, var(--muted) 50%),\n    linear-gradient(135deg, var(--muted) 50%, transparent 50%);\n  background-position: calc(100% - 17px) 50%, calc(100% - 12px) 50%;\n  background-size: 5px 5px;\n  background-repeat: no-repeat;\n}\n\n/* data-preview는 문서·미리보기에서 상태를 고정해 보여 주기 위한 속성 */\n.rig-input:hover:not(:disabled),\n.rig-textarea:hover:not(:disabled),\n.rig-select:hover:not(:disabled),\n[data-preview=\"hover\"]:is(.rig-input, .rig-textarea, .rig-select) {\n  border-color: var(--muted);\n}\n\n.rig-input:focus-visible,\n.rig-textarea:focus-visible,\n.rig-select:focus-visible,\n[data-preview=\"focus\"]:is(.rig-input, .rig-textarea, .rig-select) {\n  outline: 2px solid var(--accent);\n  outline-offset: 1px;\n  border-color: var(--accent);\n}\n\n:is(.rig-input, .rig-textarea, .rig-select, .rig-toggle, .rig-button):disabled {\n  opacity: 0.55;\n  cursor: not-allowed;\n}\n\n/* ---------- 검증 오류 ---------- */\n\n.rig-field { display: grid; gap: var(--space-1); min-width: 0; }\n.rig-field > .rig-input, .rig-field > .rig-select { width: 100%; }\n\n:is(.rig-input, .rig-textarea, .rig-select)[aria-invalid=\"true\"] { border-color: var(--danger); }\n:is(.rig-input, .rig-textarea, .rig-select)[aria-invalid=\"true\"]:focus-visible { outline-color: var(--danger); }\n\n.rig-error {\n  margin: 0;\n  color: var(--danger);\n  font-size: var(--text-sm);\n  line-height: var(--leading-tight);\n}\n\n/* ---------- 토글 (input[type=checkbox]) ---------- */\n\n.rig-toggle {\n  appearance: none;\n  position: relative;\n  flex: none;\n  width: 40px;\n  height: var(--control-h);   /* 시각적 트랙은 20px, 클릭 영역은 32px */\n  margin: 0;\n  border-radius: var(--radius);\n  cursor: pointer;\n}\n.rig-toggle::before,\n.rig-toggle::after {\n  content: \"\";\n  position: absolute;\n  border-radius: 999px;\n  transition: transform var(--duration) ease-out, background-color var(--duration) ease-out;\n}\n.rig-toggle::before { inset: 6px 2px; background: var(--muted); }\n.rig-toggle::after { top: 8px; left: 4px; width: 16px; height: 16px; background: var(--surface); }\n.rig-toggle:checked::before { background: var(--accent-fill); }\n.rig-toggle:checked::after { transform: translateX(16px); }\n.rig-toggle:hover:not(:disabled)::before,\n.rig-toggle[data-preview=\"hover\"]::before { box-shadow: 0 0 0 3px var(--border); }\n.rig-toggle:focus-visible,\n.rig-toggle[data-preview=\"focus\"] { outline: 2px solid var(--accent); outline-offset: 0; }\n.rig-toggle[aria-invalid=\"true\"]::before { box-shadow: 0 0 0 2px var(--danger); }\n\n/* ---------- 버튼 ---------- */\n\n.rig-button {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: var(--space-2);\n  min-height: var(--control-h);\n  padding: 0 var(--space-4);\n  font: inherit;\n  font-size: var(--text-md);\n  font-weight: 500;\n  color: var(--fg);\n  background: var(--surface);\n  border: 1px solid var(--border);\n  border-radius: var(--radius);\n  cursor: pointer;\n  white-space: nowrap;\n  transition: background-color var(--duration) ease-out, border-color var(--duration) ease-out;\n}\n.rig-button:hover:not(:disabled),\n.rig-button[data-preview=\"hover\"] {\n  background: color-mix(in srgb, var(--fg) 6%, var(--surface));\n  border-color: var(--muted);\n}\n.rig-button:active:not(:disabled) { background: color-mix(in srgb, var(--fg) 10%, var(--surface)); }\n.rig-button:focus-visible,\n.rig-button[data-preview=\"focus\"] { outline: 2px solid var(--accent); outline-offset: 2px; }\n\n.rig-button--primary { color: var(--on-accent); background: var(--accent-fill); border-color: var(--accent-fill); }\n.rig-button--primary:hover:not(:disabled),\n.rig-button--primary[data-preview=\"hover\"] {\n  background: color-mix(in srgb, var(--accent-fill) 88%, var(--fg));\n  border-color: color-mix(in srgb, var(--accent-fill) 88%, var(--fg));\n}\n\n.rig-button--danger { color: var(--on-danger); background: var(--danger); border-color: var(--danger); }\n.rig-button--danger:hover:not(:disabled),\n.rig-button--danger[data-preview=\"hover\"] {\n  background: color-mix(in srgb, var(--danger) 88%, var(--fg));\n  border-color: color-mix(in srgb, var(--danger) 88%, var(--fg));\n}\n.rig-button--danger:focus-visible { outline-color: var(--danger); }\n\n/* ---------- 배지 ---------- */\n\n.rig-badge {\n  --tone: var(--muted);\n  display: inline-flex;\n  align-items: center;\n  gap: 6px;\n  padding: 2px var(--space-2);\n  font-size: var(--text-xs);\n  font-weight: 500;\n  line-height: var(--leading-tight);\n  color: var(--tone);\n  background: color-mix(in srgb, var(--tone) 12%, transparent);\n  border: 1px solid color-mix(in srgb, var(--tone) 30%, transparent);\n  border-radius: 999px;\n  white-space: nowrap;\n}\n.rig-badge::before { content: \"\"; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }\n.rig-badge--success { --tone: var(--success); }\n.rig-badge--warning { --tone: var(--warning); }\n.rig-badge--danger  { --tone: var(--danger); }\n\n/* ---------- 읽기 전용 목록 / 표 ---------- */\n\n.rig-list { margin: 0; padding: 0; list-style: none; }\n.rig-list > li {\n  display: flex;\n  flex-wrap: wrap;\n  align-items: center;\n  justify-content: space-between;\n  gap: var(--space-1) var(--space-4);\n  padding: var(--space-2) 0;\n}\n.rig-list > li + li { border-top: 1px solid var(--border); }\n.rig-list code, .rig-table code { font-family: var(--font-mono); font-size: var(--text-sm); }\n\n.rig-table-wrap { overflow-x: auto; }\n.rig-table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }\n.rig-table th,\n.rig-table td {\n  padding: var(--space-2) var(--space-3);\n  text-align: left;\n  vertical-align: middle;\n  border-bottom: 1px solid var(--border);\n}\n.rig-table th { font-weight: 500; color: var(--muted); }\n.rig-table tbody tr:last-child > * { border-bottom: 0; }\n.rig-table .rig-num { text-align: right; font-variant-numeric: tabular-nums; }\n<\u002Fstyle>\n<style>\n/* 사이드바 레이아웃: 색과 간격은 rig-ui.css 토큰만 사용 */\nbody.rig-shell {\n  display: grid;\n  grid-template-columns: 240px minmax(0, 1fr);\n  min-height: 100vh;\n  margin: 0;\n  background: var(--bg);\n  color: var(--fg);\n  font: var(--text-md) / var(--leading) var(--font);\n}\n.rig-shell > .rig-page { width: 100%; box-sizing: border-box; }\n\n.rig-side {\n  position: sticky;\n  top: 0;\n  align-self: start;\n  box-sizing: border-box;\n  height: 100vh;\n  overflow-y: auto;\n  padding: var(--space-5) var(--space-3);\n  background: var(--surface);\n  border-right: 1px solid var(--border);\n}\n.rig-side-title {\n  margin: 0 0 var(--space-4);\n  padding: 0 var(--space-3);\n  font-size: var(--text-lg);\n  font-weight: 600;\n}\n.rig-nav { display: grid; gap: var(--space-4); }\n.rig-nav-group { display: grid; gap: var(--space-1); }\n.rig-nav-cat {\n  margin: 0;\n  padding: 0 var(--space-3);\n  color: var(--muted);\n  font-size: var(--text-xs);\n  font-weight: 600;\n  letter-spacing: 0.04em;\n}\n.rig-nav-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; }\n\n.rig-nav-item {\n  box-sizing: border-box;\n  display: flex;\n  align-items: center;\n  width: 100%;\n  min-height: var(--control-h);\n  padding: 0 var(--space-3);\n  font: inherit;\n  font-size: var(--text-md);\n  color: var(--muted);\n  text-align: left;\n  background: transparent;\n  border: 0;\n  border-radius: var(--radius);\n  cursor: pointer;\n  transition: background-color var(--duration) ease-out, color var(--duration) ease-out;\n}\n.rig-nav-item:hover { color: var(--fg); background: color-mix(in srgb, var(--fg) 6%, transparent); }\n.rig-nav-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }\n.rig-nav-item[aria-current=\"true\"] {\n  color: var(--fg);\n  font-weight: 600;\n  background: color-mix(in srgb, var(--accent-fill) 20%, var(--surface));\n}\n\n.rig-shell details[id], .rig-shell [id^=\"r-\"], .rig-shell #states { scroll-margin-top: var(--space-4); }\n\n@media (max-width: 759px) {\n  body.rig-shell { grid-template-columns: minmax(0, 1fr); }\n  .rig-side {\n    position: static;\n    height: auto;\n    overflow: visible;\n    padding: var(--space-4);\n    border-right: 0;\n    border-bottom: 1px solid var(--border);\n  }\n  .rig-side-title { padding: 0; margin-bottom: var(--space-3); }\n  .rig-nav-cat { padding: 0; }\n  .rig-nav-list { display: flex; flex-wrap: wrap; gap: var(--space-1); }\n  .rig-nav-item { width: auto; }\n}\n<\u002Fstyle>\n<\u002Fhead>\n<body class=\"rig-shell\">\n\n<aside class=\"rig-side\">\n  <h2 class=\"rig-side-title\">설정<\u002Fh2>\n  <nav class=\"rig-nav\" aria-label=\"설정 메뉴\">\n    <div class=\"rig-nav-group\">\n      <p class=\"rig-nav-cat\" id=\"cat-general\">일반<\u002Fp>\n      <ul class=\"rig-nav-list\" aria-labelledby=\"cat-general\">\n        <li><button class=\"rig-nav-item\" type=\"button\" data-target=\"r-auto-sync\" aria-current=\"true\">자동 동기화<\u002Fbutton><\u002Fli>\n        <li><button class=\"rig-nav-item\" type=\"button\" data-target=\"r-interval\">동기화 간격<\u002Fbutton><\u002Fli>\n        <li><button class=\"rig-nav-item\" type=\"button\" data-target=\"r-branch\">기본 브랜치<\u002Fbutton><\u002Fli>\n        <li><button class=\"rig-nav-item\" type=\"button\" data-target=\"r-template\">커밋 메시지 템플릿<\u002Fbutton><\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div class=\"rig-nav-group\">\n      <p class=\"rig-nav-cat\" id=\"cat-remote\">원격 연결<\u002Fp>\n      <ul class=\"rig-nav-list\" aria-labelledby=\"cat-remote\">\n        <li><button class=\"rig-nav-item\" type=\"button\" data-target=\"r-remote\">원격 URL<\u002Fbutton><\u002Fli>\n        <li><button class=\"rig-nav-item\" type=\"button\" data-target=\"r-token\">액세스 토큰<\u002Fbutton><\u002Fli>\n        <li><button class=\"rig-nav-item\" type=\"button\" data-target=\"r-detected\">감지된 원격<\u002Fbutton><\u002Fli>\n        <li><button class=\"rig-nav-item\" type=\"button\" data-target=\"r-log\">최근 동기화<\u002Fbutton><\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div class=\"rig-nav-group\">\n      <p class=\"rig-nav-cat\" id=\"cat-advanced\">고급<\u002Fp>\n      <ul class=\"rig-nav-list\" aria-labelledby=\"cat-advanced\">\n        <li><button class=\"rig-nav-item\" type=\"button\" data-target=\"r-debug\">디버그 로그<\u002Fbutton><\u002Fli>\n        <li><button class=\"rig-nav-item\" type=\"button\" data-target=\"r-proxy\">프록시 주소<\u002Fbutton><\u002Fli>\n        <li><button class=\"rig-nav-item\" type=\"button\" data-target=\"r-reset\">로컬 캐시 초기화<\u002Fbutton><\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div class=\"rig-nav-group\">\n      <p class=\"rig-nav-cat\" id=\"cat-ref\">참고<\u002Fp>\n      <ul class=\"rig-nav-list\" aria-labelledby=\"cat-ref\">\n        <li><button class=\"rig-nav-item\" type=\"button\" data-target=\"states\">컨트롤 상태<\u002Fbutton><\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fnav>\n<\u002Faside>\n\n<main class=\"rig-page\">\n\n<header style=\"display:grid;gap:4px\">\n  <div class=\"rig-actions\" style=\"justify-content:space-between;align-items:center\">\n    <h1 class=\"rig-heading\">Git 동기화<\u002Fh1>\n    <span class=\"rig-badge rig-badge--success\">연결됨<\u002Fspan>\n  <\u002Fdiv>\n  <p class=\"rig-text rig-text--muted\">버전 1.4.2 · 볼트를 원격 저장소와 주기적으로 동기화합니다.<\u002Fp>\n<\u002Fheader>\n\n<details class=\"rig-section\" id=\"sec-general\" open=\"\">\n  <summary>일반<\u002Fsummary>\n  <div class=\"rig-row\" id=\"r-auto-sync\">\n    <div class=\"rig-row-info\">\n      <label class=\"rig-row-label\" for=\"auto-sync\">자동 동기화<\u002Flabel>\n      <p class=\"rig-row-desc\" id=\"auto-sync-desc\">변경 사항을 설정한 간격마다 커밋하고 푸시합니다.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"rig-row-control\">\n      <input class=\"rig-toggle\" type=\"checkbox\" role=\"switch\" id=\"auto-sync\" aria-describedby=\"auto-sync-desc\" checked=\"\">\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"rig-row\" id=\"r-interval\">\n    <div class=\"rig-row-info\">\n      <label class=\"rig-row-label\" for=\"interval\">동기화 간격(분)<\u002Flabel>\n      <p class=\"rig-row-desc\" id=\"interval-desc\">1–120 사이 값을 입력합니다.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"rig-row-control\">\n      <input class=\"rig-input\" type=\"number\" id=\"interval\" min=\"1\" max=\"120\" value=\"10\" aria-describedby=\"interval-desc\">\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"rig-row\" id=\"r-branch\">\n    <div class=\"rig-row-info\">\n      <label class=\"rig-row-label\" for=\"branch\">기본 브랜치<\u002Flabel>\n      <p class=\"rig-row-desc\">푸시 대상 브랜치입니다.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"rig-row-control\">\n      <select class=\"rig-select\" id=\"branch\">\n        <option>main<\u002Foption>\n        <option>develop<\u002Foption>\n        <option>notes<\u002Foption>\n      <\u002Fselect>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"rig-row rig-row--block\" id=\"r-template\">\n    <div class=\"rig-row-info\">\n      <label class=\"rig-row-label\" for=\"template\">커밋 메시지 템플릿<\u002Flabel>\n      <p class=\"rig-row-desc\" id=\"template-desc\"><code>{{date}}<\u002Fcode>, <code>{{count}}<\u002Fcode> 변수를 쓸 수 있습니다.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"rig-row-control\">\n      <textarea class=\"rig-textarea rig-textarea--mono\" id=\"template\" rows=\"3\" aria-describedby=\"template-desc\">vault backup: {{date}} ({{count}} files)<\u002Ftextarea>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdetails>\n\n<details class=\"rig-section\" id=\"sec-remote\" open=\"\">\n  <summary>원격 연결<\u002Fsummary>\n  <div class=\"rig-row\" id=\"r-remote\">\n    <div class=\"rig-row-info\">\n      <label class=\"rig-row-label\" for=\"remote\">원격 URL<\u002Flabel>\n      <p class=\"rig-row-desc\">HTTPS 또는 SSH 주소<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"rig-row-control\">\n      <div class=\"rig-field\">\n        <input class=\"rig-input\" type=\"text\" id=\"remote\" value=\"github.com/mai/vault\" aria-invalid=\"true\" aria-describedby=\"remote-err\">\n        <p class=\"rig-error\" id=\"remote-err\">https:// 또는 git@로 시작해야 합니다.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"rig-row\" id=\"r-token\">\n    <div class=\"rig-row-info\">\n      <label class=\"rig-row-label\" for=\"token\">액세스 토큰<\u002Flabel>\n      <p class=\"rig-row-desc\">기기의 키체인에 저장됩니다.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"rig-row-control\">\n      <input class=\"rig-input\" type=\"password\" id=\"token\" value=\"ghp_example_token\" autocomplete=\"off\">\n      <button class=\"rig-button\" type=\"button\">연결 테스트<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"rig-row rig-row--block\" id=\"r-detected\">\n    <div class=\"rig-row-info\">\n      <span class=\"rig-row-label\">감지된 원격<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"rig-row-control\">\n      <ul class=\"rig-list\">\n        <li><code>origin<\u002Fcode><span class=\"rig-badge rig-badge--success\">응답<\u002Fspan><\u002Fli>\n        <li><code>backup<\u002Fcode><span class=\"rig-badge rig-badge--warning\">인증 필요<\u002Fspan><\u002Fli>\n        <li><code>mirror<\u002Fcode><span class=\"rig-badge\">사용 안 함<\u002Fspan><\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"rig-row rig-row--block\" id=\"r-log\">\n    <div class=\"rig-row-info\">\n      <span class=\"rig-row-label\" id=\"log-label\">최근 동기화<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"rig-row-control\">\n      <div class=\"rig-table-wrap\">\n        <table class=\"rig-table\" aria-labelledby=\"log-label\">\n          <thead><tr><th scope=\"col\">시각<\u002Fth><th scope=\"col\">결과<\u002Fth><th scope=\"col\" class=\"rig-num\">변경 파일<\u002Fth><\u002Ftr><\u002Fthead>\n          <tbody>\n            <tr><td>11월 12일 14:20<\u002Ftd><td><span class=\"rig-badge rig-badge--success\">성공<\u002Fspan><\u002Ftd><td class=\"rig-num\">12<\u002Ftd><\u002Ftr>\n            <tr><td>11월 12일 14:10<\u002Ftd><td><span class=\"rig-badge rig-badge--danger\">충돌<\u002Fspan><\u002Ftd><td class=\"rig-num\">3<\u002Ftd><\u002Ftr>\n            <tr><td>11월 12일 14:00<\u002Ftd><td><span class=\"rig-badge\">변경 없음<\u002Fspan><\u002Ftd><td class=\"rig-num\">0<\u002Ftd><\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdetails>\n\n<details class=\"rig-section\" id=\"sec-advanced\">\n  <summary>고급<\u002Fsummary>\n  <p class=\"rig-section-desc\">일반적인 사용에서는 바꿀 필요가 없습니다.<\u002Fp>\n  <div class=\"rig-row\" id=\"r-debug\">\n    <div class=\"rig-row-info\">\n      <label class=\"rig-row-label\" for=\"debug\">디버그 로그<\u002Flabel>\n      <p class=\"rig-row-desc\" id=\"debug-desc\">개발자 모드에서만 켤 수 있습니다.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"rig-row-control\">\n      <input class=\"rig-toggle\" type=\"checkbox\" role=\"switch\" id=\"debug\" aria-describedby=\"debug-desc\" disabled=\"\">\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"rig-row\" id=\"r-proxy\">\n    <div class=\"rig-row-info\">\n      <label class=\"rig-row-label\" for=\"proxy\">프록시 주소<\u002Flabel>\n      <p class=\"rig-row-desc\">시스템 프록시를 사용 중입니다.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"rig-row-control\">\n      <input class=\"rig-input\" type=\"text\" id=\"proxy\" placeholder=\"http://127.0.0.1:8080\" disabled=\"\">\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"rig-row\" id=\"r-reset\">\n    <div class=\"rig-row-info\">\n      <span class=\"rig-row-label\">로컬 캐시 초기화<\u002Fspan>\n      <p class=\"rig-row-desc\" id=\"reset-desc\">커밋되지 않은 변경 사항이 삭제됩니다.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"rig-row-control\">\n      <button class=\"rig-button rig-button--danger\" type=\"button\" aria-describedby=\"reset-desc\">초기화<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdetails>\n\n<div class=\"rig-actions\">\n  <button class=\"rig-button\" type=\"button\">취소<\u002Fbutton>\n  <button class=\"rig-button rig-button--primary\" type=\"button\">저장<\u002Fbutton>\n<\u002Fdiv>\n\n<hr class=\"rig-divider\">\n\n<section style=\"display:grid;gap:12px\" aria-labelledby=\"states-title\" id=\"states\">\n  <h2 class=\"rig-heading\" id=\"states-title\">컨트롤 상태<\u002Fh2>\n  <p class=\"rig-text rig-text--muted\">hover와 focus-visible 열은 미리보기용 data-preview 속성으로 고정한 모습입니다.<\u002Fp>\n  <div class=\"rig-section rig-table-wrap\">\n    <table class=\"rig-table\">\n      <thead><tr><th scope=\"col\">컨트롤<\u002Fth><th scope=\"col\">기본<\u002Fth><th scope=\"col\">hover<\u002Fth><th scope=\"col\">focus-visible<\u002Fth><th scope=\"col\">disabled<\u002Fth><th scope=\"col\">오류<\u002Fth><\u002Ftr><\u002Fthead>\n      <tbody>\n        <tr>\n          <th scope=\"row\">input<\u002Fth>\n          <td><input class=\"rig-input\" style=\"width:120px\" aria-label=\"기본\" value=\"값\"><\u002Ftd>\n          <td><input class=\"rig-input\" style=\"width:120px\" aria-label=\"hover\" value=\"값\" data-preview=\"hover\"><\u002Ftd>\n          <td><input class=\"rig-input\" style=\"width:120px\" aria-label=\"focus\" value=\"값\" data-preview=\"focus\"><\u002Ftd>\n          <td><input class=\"rig-input\" style=\"width:120px\" aria-label=\"disabled\" value=\"값\" disabled=\"\"><\u002Ftd>\n          <td><input class=\"rig-input\" style=\"width:120px\" aria-label=\"오류\" value=\"값\" aria-invalid=\"true\"><\u002Ftd>\n        <\u002Ftr>\n        <tr>\n          <th scope=\"row\">select<\u002Fth>\n          <td><select class=\"rig-select\" aria-label=\"기본\"><option>main<\u002Foption><\u002Fselect><\u002Ftd>\n          <td><select class=\"rig-select\" aria-label=\"hover\" data-preview=\"hover\"><option>main<\u002Foption><\u002Fselect><\u002Ftd>\n          <td><select class=\"rig-select\" aria-label=\"focus\" data-preview=\"focus\"><option>main<\u002Foption><\u002Fselect><\u002Ftd>\n          <td><select class=\"rig-select\" aria-label=\"disabled\" disabled=\"\"><option>main<\u002Foption><\u002Fselect><\u002Ftd>\n          <td><select class=\"rig-select\" aria-label=\"오류\" aria-invalid=\"true\"><option>main<\u002Foption><\u002Fselect><\u002Ftd>\n type=\"button\" disabled=\"\">위험<\u002Fbutton><\u002Ftd>\n          <td>—<\u002Ftd>\n        <\u002Ftr>\n        <tr>\n          <th scope=\"row\">badge<\u002Fth>\n          <td><span class=\"rig-badge rig-badge--success\">성공<\u002Fspan><\u002Ftd>\n          <td><span class=\"rig-badge rig-badge--warning\">경고<\u002Fspan><\u002Ftd>\n          <td><span class=\"rig-badge rig-badge--danger\">오류<\u002Fspan><\u002Ftd>\n          <td><span class=\"rig-badge\">중립<\u002Fspan><\u002Ftd>\n          <td>—<\u002Ftd>\n        <\u002Ftr>\n      <\u002Ftbody>\n    <\u002Ftable>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fmain>\n\n<script>\n(function () {\n  var items = Array.prototype.slice.call(document.querySelectorAll('.rig-nav-item'));\n  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n\n  items.forEach(function (btn) {\n    btn.addEventListener('click', function () {\n      items.forEach(function (b) { b.removeAttribute('aria-current'); });\n      btn.setAttribute('aria-current', 'true');\n\n      var target = document.getElementById(btn.getAttribute('data-target'));\n      if (!target) return;\n      var section = target.closest('details');\n      if (section) section.open = true;\n      target.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });\n    });\n  });\n})();\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
